# Picturesk web (Next.js). Deploy from the repo root:  fly deploy -c fly.web.toml
app = "picturesk-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.web"
  # NEXT_PUBLIC_* are inlined at BUILD time, so they live here, not in secrets.
  # Rebuild (redeploy) the web app after changing any of these.
  [build.args]
    # REQUIRED: the deployed API's public origin (the browser calls it directly).
    NEXT_PUBLIC_API_BASE_URL = "https://api.picturesk.ai"
    # GA4 measurement ID. Inlined at build; a web redeploy is required to change it.
    NEXT_PUBLIC_GA_ID = "G-V68VHN1XSX"
    # Optional (code defaults shown). Keep in sync with the API's UPLOAD_* values.
    # NEXT_PUBLIC_UPLOAD_MIN_PHOTOS = "5"
    # NEXT_PUBLIC_UPLOAD_MAX_PHOTOS = "15"
    # NEXT_PUBLIC_UPLOAD_MIN_FACE_RATIO = "0.15"
    # Optional analytics + Sentry (leave unset to disable).
    # NEXT_PUBLIC_ANALYTICS_DOMAIN = "picturesk.ai"
    # NEXT_PUBLIC_SENTRY_DSN = "https://xxxx@oyyyy.ingest.sentry.io/zzzz"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
