# Picturesk worker. Deploy from the repo root:  fly deploy -c fly.picturesk-worker.toml
# No public service: it drains the BullMQ order-pipeline queue and must run
# continuously, so there is no [http_service] and no auto-stop.
app = "picturesk-worker"
primary_region = "iad"

[build]
  dockerfile = "apps/picturesk-worker/Dockerfile"

[env]
  # LoRA generation strength for real orders (read at call time by the worker's
  # defaultLoraScale). 1.0 is neutral; 1.15 pulls harder toward the trained face to
  # improve likeness. This is slightly above the documented 0.8-1.1 range, so watch
  # for an over-baked / artifacty look and dial back if it appears.
  GEN_LORA_SCALE = "1.15"

# concurrency is 1 in code (one order at a time); a single machine is the default.
# The pipeline is resumable + idempotent, so a restart safely reattaches.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"   # building a training zip (download + zip the photos) needs headroom
