name: VisaWadi Daily Blog Publish

on:
  schedule:
    - cron: '0 5 * * *' # 9AM UAE (UTC+4) = 5AM UTC
  workflow_dispatch:
    inputs:
      status:
        description: 'Publish immediately or stage as a draft'
        type: choice
        options: [published, draft]
        default: draft

jobs:
  generate-blog-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Generate and publish blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VISAWADI_ADMIN_EMAIL: ${{ secrets.VISAWADI_ADMIN_EMAIL }}
          VISAWADI_ADMIN_PASSWORD: ${{ secrets.VISAWADI_ADMIN_PASSWORD }}
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
        run: node generate-blog-draft.mjs --brand visawadi --status "${{ inputs.status || 'published' }}"
        working-directory: scripts
