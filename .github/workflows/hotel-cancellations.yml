name: Hotel Cancellations

on:
  # DISABLED 2026-10-17 on request. Nothing was awaiting auto-cancellation at the
  # time. While this is off, a refundable booking that passes its free window
  # becomes a room someone has paid for, so cancel by hand or run this manually.
  # schedule:
  #   - cron: '17 * * * *' # hourly, off the hour to avoid the platform's busiest minute
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be cancelled without cancelling
        type: boolean
        default: false

# The failure reporter in _automation.yml opens an issue, and a called workflow
# cannot request more than its caller holds. The repo default is read-only, so
# the caller has to grant it here.
permissions:
  contents: read
  issues: write

jobs:
  cancel:
    uses: ./.github/workflows/_automation.yml
    secrets: inherit
    with:
      job: hotel-cancellations
      dry_run: ${{ inputs.dry_run || false }}
