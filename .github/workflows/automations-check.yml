# Runs on every change to the automations, so a broken target or a generator that
# no longer starts is caught in the pull request rather than at 05:00 in a cron.
name: Automations Check

on:
  pull_request:
    paths: ['automations/**', '.github/workflows/_automation.yml', '.github/workflows/automations-check.yml']
  push:
    branches: [master]
    paths: ['automations/**']
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate every target against the schema
        working-directory: automations
        run: node src/cli.mjs check

      # No credentials: a dry run must stay runnable without them, which is what
      # makes this check meaningful on a fork PR.
      - name: Dry-run every target against the jobs it declares
        working-directory: automations
        run: |
          node --input-type=module -e '
            const { listTargets, loadTarget } = await import("./src/registry.mjs");
            for (const key of listTargets()) {
              const t = await loadTarget(key);
              const jobs = Array.isArray(t.jobs) ? t.jobs : ["blog-generate"];
              for (const j of jobs) console.log(`${key} ${j}`);
            }
          ' > combos.txt
          while read -r t j; do
            echo "--- $t / $j"
            node src/cli.mjs "$j" --target "$t" --dry-run > /dev/null
          done < combos.txt
          rm -f combos.txt
