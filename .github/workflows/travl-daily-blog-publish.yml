name: Travl Daily Blog Publish

on:
  # PAUSED 2026-07-19: the daily auto-run is disabled while the 40-post backlog
  # publishes one per day (scheduled through 2026-08-28). To resume, uncomment the
  # schedule block below and push — new posts will then publish automatically again.
  # schedule:
  #   - cron: '0 5 * * *' # 9AM UAE (UTC+4) = 5AM UTC
  workflow_dispatch: # manual trigger from the GitHub UI still works while paused

jobs:
  generate-blog-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Generate and publish blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRAVL_ADMIN_EMAIL: ${{ secrets.TRAVL_ADMIN_EMAIL }}
          TRAVL_ADMIN_PASSWORD: ${{ secrets.TRAVL_ADMIN_PASSWORD }}
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
        run: node generate-blog-draft.mjs
        working-directory: scripts
