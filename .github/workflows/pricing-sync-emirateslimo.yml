name: Emirates Limo Pricing Sync

on:
  schedule:
    - cron: '0 5 * * 1,4' # Monday and Thursday, 09:00 Gulf time
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read the sheet and report without writing
        type: boolean
        default: false

# The failure reporter in _automation.yml opens an issue, and a called workflow
# cannot request more than its caller holds. The repo default is read-only, so
# the caller has to grant it here.
permissions:
  contents: read
  issues: write

jobs:
  sync:
    uses: ./.github/workflows/_automation.yml
    secrets: inherit
    with:
      job: pricing-sync
      dry_run: ${{ inputs.dry_run || false }}
